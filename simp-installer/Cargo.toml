[package]
name = "simp-installer"
version = "0.1.0"
edition = "2024"

[features]
default = []
# Fixture data and simulated progress are excluded from normal builds.
ui-preview = []

[dependencies]
gpui-kit = "0.6.6"
eyre = "0.6.14"
simp-core = { path="../simp-core"}
tokio = { version = "1.53.1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui-kit = { version = "0.6.6", features = ["test-support"] }

[build-dependencies]
embed-resource = "3.0.11"
