[package]
name = "simp-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
eyre = "0.6.14"
bitcode = "0.6.9"
async-compression = { version = "0.4.48", features = ["tokio", "zstd"] }
tokio = { version = "1.53.1", features = ["full"] }

[dev-dependencies]
zstd = { version = "0.14.0", default-features = false }
